<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ACP Chat</title>
<style>
  :root {
    --bg: #131316;
    --sidebar: #0f0f12;
    --surface: #1a1a20;
    --surface-2: #212129;
    --surface-3: #282831;
    --border: #2a2a34;
    --border-strong: #383843;
    --text: #e9e9ee;
    --text-dim: #a2a2ad;
    --text-mute: #6c6c78;
    --accent: #4d6bfe;
    --accent-soft: #1c2350;
    --accent-line: #2f3d7a;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app { height: 100%; display: flex; }

  /* ================= sidebar ================= */
  .sidebar {
    width: 214px; flex: 0 0 auto;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .sb-head { padding: 10px 10px 8px; }
  .new-btn {
    width: 100%; display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 9px;
    padding: 8px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .new-btn:hover { border-color: var(--accent-line); color: var(--text); background: var(--surface-2); }
  .new-btn .plus { font-size: 14px; line-height: 1; }

  .sb-label {
    padding: 8px 14px 4px; font-size: 10.5px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--text-mute);
  }

  .sb-list { flex: 1 1 auto; overflow-y: auto; padding: 2px 7px 10px; }
  .sb-list::-webkit-scrollbar { width: 8px; }
  .sb-list::-webkit-scrollbar-thumb { background: #26262e; border-radius: 4px; border: 2px solid var(--sidebar); }

  .sb-item {
    padding: 7px 9px; border-radius: 8px; cursor: pointer;
    margin-bottom: 2px; border: 1px solid transparent;
    transition: background .12s;
  }
  .sb-item:hover { background: var(--surface); }
  .sb-item.active { background: var(--surface-2); border-color: var(--border); }
  .sb-item .t {
    font-size: 12.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-item.active .t { color: var(--text); }
  .sb-item .m {
    font-size: 10.5px; color: var(--text-mute); margin-top: 1px;
    display: flex; gap: 6px;
  }
  .sb-empty { padding: 10px 14px; font-size: 11.5px; color: var(--text-mute); }

  .sb-foot {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-mute);
  }

  /* ================= main column ================= */
  .main-col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40%;
  }
  .title .badge {
    display: inline-block; margin-left: 7px;
    font-size: 10px; font-weight: 500; color: var(--text-mute);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
    vertical-align: 1px;
  }
  .spacer { flex: 1 1 auto; }

  select {
    appearance: none;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 26px 5px 9px; font: inherit; font-size: 12.5px;
    cursor: pointer; max-width: 280px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%236c6c78' stroke-width='1.4' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
    transition: border-color .15s;
  }
  select:hover:not(:disabled) { border-color: var(--border-strong); }
  select:focus { outline: none; border-color: var(--accent-line); }
  select:disabled { opacity: .5; cursor: default; }
  #agent { max-width: 300px; }
  .config-selects { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .config-selects select { max-width: 220px; }
  .config-selects select.cfg-model { min-width: 150px; }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-mute); flex: 0 0 auto; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.7); }
  .dot.err { background: var(--err); }

  .banner {
    flex: 0 0 auto; display: none;
    padding: 7px 14px; font-size: 12.5px;
    background: #2a2313; color: var(--warn);
    border-bottom: 1px solid #3f3518;
  }
  .banner.show { display: block; }
  .banner.err { background: #2d1719; color: #ff9c96; border-bottom-color: #4a2327; }

  /* ================= transcript ================= */
  main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 22px 20px 10px; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: transparent; }
  main::-webkit-scrollbar-thumb { background: #2f2f39; border-radius: 6px; border: 3px solid var(--bg); }
  main::-webkit-scrollbar-thumb:hover { background: #3d3d49; }

  .empty {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 13px;
    color: var(--text-mute); text-align: center; user-select: none;
  }
  .empty .logo {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, #4d6bfe, #7c5cff);
    display: grid; place-items: center; font-size: 21px; color: #fff;
    box-shadow: 0 8px 26px rgba(77,107,254,.28);
  }
  .empty h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-dim); }
  .empty p { margin: 0; font-size: 12.5px; line-height: 1.9; }
  .empty code {
    background: var(--surface-2); padding: 2px 7px; border-radius: 5px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 3px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); border-radius: 999px;
    padding: 6px 13px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--accent-line); color: var(--text); background: var(--surface-2); }

  .row { margin: 0 0 20px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .row.user { display: flex; justify-content: flex-end; }
  .row.user .bubble {
    max-width: 84%; background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-radius: 14px 14px 5px 14px;
    padding: 9px 14px; white-space: pre-wrap; word-break: break-word;
  }

  .row.assistant .who {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--text-mute); margin-bottom: 5px;
  }
  .row.assistant .who .glyph {
    width: 15px; height: 15px; border-radius: 4px;
    background: linear-gradient(135deg, #4d6bfe, #7c5cff);
    display: grid; place-items: center; font-size: 8px; color: #fff;
  }

  .content { word-break: break-word; }
  .content > *:first-child { margin-top: 0; }
  .content > *:last-child { margin-bottom: 0; }
  .content p { margin: 0 0 9px; }
  .content h1, .content h2, .content h3 { margin: 14px 0 7px; font-size: 14px; }
  .content ul, .content ol { margin: 6px 0 9px; padding-left: 20px; }
  .content li { margin: 2px 0; }
  .content a { color: #7f97ff; text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content code {
    font-family: var(--mono); font-size: 12px;
    background: var(--surface-3); padding: 1.5px 5px; border-radius: 4px; color: #d8d8e2;
  }

  .codeblock {
    margin: 10px 0; background: #0f0f13;
    border: 1px solid var(--border); border-radius: 9px; overflow: hidden;
  }
  .codeblock .cb-head {
    display: flex; align-items: center; padding: 6px 11px;
    background: #17171d; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-mute); font-family: var(--mono);
  }
  .codeblock .cb-copy {
    margin-left: auto; background: none; border: 0; color: var(--text-mute);
    font-size: 11px; cursor: pointer; padding: 1px 4px; border-radius: 4px;
  }
  .codeblock .cb-copy:hover { color: var(--text); background: var(--surface-3); }
  .codeblock pre {
    margin: 0; padding: 11px 13px; overflow-x: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: #cfd3e1;
  }

  details.thought { margin: 0 0 12px; }
  details.thought summary {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    font-size: 12px; color: var(--text-mute);
    padding: 3px 9px 3px 8px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    transition: all .15s;
  }
  details.thought summary::-webkit-details-marker { display: none; }
  details.thought summary:hover { color: var(--text-dim); border-color: var(--border-strong); }
  details.thought summary .chev { transition: transform .15s; font-size: 9px; }
  details.thought[open] summary .chev { transform: rotate(90deg); }
  details.thought .trail {
    margin-top: 8px; padding: 10px 13px;
    background: var(--surface); border-left: 2px solid var(--border-strong);
    border-radius: 0 8px 8px 0;
    color: var(--text-mute); font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; max-height: 320px; overflow-y: auto;
  }

  .tool {
    margin: 0 0 10px; background: var(--surface);
    border: 1px solid var(--border); border-left: 2px solid var(--text-mute);
    border-radius: 8px; overflow: hidden;
  }
  .tool.pending { border-left-color: var(--warn); }
  .tool.in_progress { border-left-color: var(--accent); }
  .tool.completed { border-left-color: var(--ok); }
  .tool.failed { border-left-color: var(--err); }
  .tool .thead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
  .tool .thead:hover { background: var(--surface-2); }
  .tool .icn { font-size: 11px; width: 13px; text-align: center; }
  .tool .ttl { font-size: 12.5px; color: var(--text-dim); }
  .tool .kind { font-size: 10.5px; color: var(--text-mute); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .tool .st { margin-left: auto; font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
  .tool.completed .st { color: var(--ok); }
  .tool.failed .st { color: var(--err); }
  .tool.pending .st { color: var(--warn); }
  .tool .tbody { display: none; border-top: 1px solid var(--border); }
  .tool.open .tbody { display: block; }
  .tool .tbody pre {
    margin: 0; padding: 10px 12px; background: #101014;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    color: var(--text-dim); overflow-x: auto; max-height: 260px;
  }

  .perm {
    margin: 0 0 16px; border: 1px solid #4a3f16; border-radius: 10px;
    background: linear-gradient(180deg, #2a2413, #211d10); overflow: hidden;
    animation: rise .18s ease-out;
  }
  .perm .p-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 13px;
    font-size: 12.5px; color: var(--warn); font-weight: 600;
    border-bottom: 1px solid #3d3416;
  }
  .perm .p-body { padding: 10px 13px; font-size: 12.5px; color: var(--text-dim); }
  .perm .p-body pre {
    margin: 6px 0 0; background: #17140c; border-radius: 6px; padding: 8px 10px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    max-height: 200px; overflow: auto;
  }
  .perm .p-actions { display: flex; gap: 8px; padding: 0 13px 12px; flex-wrap: wrap; }
  .perm button { border-radius: 7px; padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid transparent; }
  .perm button.allow { background: var(--accent); color: #fff; }
  .perm button.allow:hover { filter: brightness(1.1); }
  .perm button.deny { background: transparent; color: #ff9c96; border-color: #5a2a2a; }
  .perm button.deny:hover { background: #2d1719; }
  .perm button:disabled { opacity: .5; cursor: default; }

  /* ================= file changes ================= */
  .tool .tdiffs { padding: 0 8px 8px; }
  .tool .tdiffs:empty { display: none; }
  .tools > .fchange { margin: 0 0 10px; }

  .fchange {
    margin-top: 6px; background: #111116;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .fchange.s-review { border-color: var(--accent-line); }
  .fc-head, .pd-head {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 6px 9px; font-size: 12px; background: #16161c;
  }
  .fc-head { cursor: pointer; }
  .fc-head:hover { background: #1b1b22; }
  .fc-icn { font-family: var(--mono); font-size: 11px; color: var(--text-mute); width: 12px; text-align: center; }
  .fc-icn.new { color: var(--ok); }
  .fc-icn.del { color: var(--err); }
  .fc-path {
    font-family: var(--mono); font-size: 11.5px; color: var(--text);
    min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fc-stat { font-family: var(--mono); font-size: 11px; display: inline-flex; gap: 5px; }
  .fc-stat .add { color: var(--ok); }
  .fc-stat .del { color: var(--err); }
  .fc-tag { font-size: 10px; color: var(--text-mute); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .fc-badge {
    font-size: 10.5px; line-height: 18px; border-radius: 999px; padding: 0 8px;
    border: 1px solid var(--border); color: var(--text-mute);
  }
  .s-review .fc-badge { color: #9fb0ff; border-color: var(--accent-line); background: var(--accent-soft); }
  .s-approval .fc-badge { color: var(--warn); border-color: #4a3f16; background: #2a2413; }
  .s-kept .fc-badge { color: var(--ok); border-color: #1f4a2a; background: #12261a; }
  .s-reverted .fc-badge { color: #ff9c96; border-color: #4a2327; background: #2d1719; }
  .s-reverted .fc-path { text-decoration: line-through; color: var(--text-mute); }
  .fc-actions { margin-left: auto; display: inline-flex; gap: 6px; }
  .fc-btn {
    font: inherit; font-size: 11.5px; line-height: 1; cursor: pointer;
    border-radius: 6px; padding: 4px 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-dim);
  }
  .fc-btn:hover:not(:disabled) { border-color: var(--border-strong); color: var(--text); }
  .fc-btn:disabled { opacity: .45; cursor: default; }
  .fc-btn.fc-keep { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fc-btn.fc-keep:hover:not(:disabled) { filter: brightness(1.1); color: #fff; }
  .fc-btn.fc-revert { background: transparent; color: #ff9c96; border-color: #5a2a2a; }
  .fc-btn.fc-revert:hover:not(:disabled) { background: #2d1719; color: #ffb3ae; }
  .fc-body, .pd-body { border-top: 1px solid var(--border); max-height: 440px; overflow: auto; }
  .fchange.collapsed .fc-body { display: none; }
  .diff-note { padding: 8px 12px; font-size: 11.5px; color: var(--text-mute); }

  .diff {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55; tab-size: 4;
  }
  .diff col.ln { width: 3.3em; }
  .diff td { padding: 0 8px 0 6px; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; color: #cfd3e1; }
  .diff td.ln { padding: 0 6px 0 0; text-align: right; color: #55555f; font-size: 10.5px; user-select: none; }
  .diff.split td:nth-child(2) { border-right: 1px solid #23232b; }
  .diff td.del { background: rgba(248,81,73,.12); }
  .diff td.add { background: rgba(63,185,80,.12); }
  .diff td.ln.del { background: rgba(248,81,73,.2); color: #b77571; }
  .diff td.ln.add { background: rgba(63,185,80,.2); color: #6ea97a; }
  .diff td.void { background: repeating-linear-gradient(135deg, #111116 0 5px, #15151b 5px 10px); }
  .diff mark { color: inherit; border-radius: 2px; }
  .diff td.del mark { background: rgba(248,81,73,.42); }
  .diff td.add mark { background: rgba(63,185,80,.4); }
  .diff .sign { display: inline-block; width: 1.2em; color: #6c6c78; user-select: none; }
  .diff td.del .sign { color: var(--err); }
  .diff td.add .sign { color: var(--ok); }
  .diff tr.gap td {
    background: #15151b; color: var(--text-mute); text-align: center;
    font-family: inherit; font-size: 11px; padding: 2px 0;
  }

  .perm .p-note { margin-bottom: 8px; }
  .pdiff { margin: 0 0 8px; background: #111116; border: 1px solid #3d3416; border-radius: 8px; overflow: hidden; }
  .pdiff .pd-head { background: #17140c; }

  /* ================= composer ================= */
  footer { flex: 0 0 auto; padding: 10px 16px 14px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px 8px 8px 14px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--accent-line); }
  .composer.disabled { opacity: .55; }
  .composer textarea {
    flex: 1 1 auto; background: transparent; border: 0; outline: none; resize: none;
    color: var(--text); font: inherit; line-height: 1.6;
    min-height: 24px; max-height: 190px; padding: 4px 0; overflow-y: auto;
  }
  .composer textarea::placeholder { color: var(--text-mute); }
  .icon-btn {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px;
    border: 0; cursor: pointer; display: grid; place-items: center;
    font-size: 15px; line-height: 1; transition: all .15s;
  }
  .icon-btn.send { background: var(--accent); color: #fff; }
  .icon-btn.send:hover:not(:disabled) { filter: brightness(1.12); }
  .icon-btn.stop { background: var(--surface-3); color: var(--text-dim); }
  .icon-btn.stop:hover:not(:disabled) { background: #3a2a2c; color: #ff9c96; }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .foot-hint { margin: 7px 4px 0; font-size: 11px; color: var(--text-mute); display: flex; align-items: center; gap: 6px; }
  .foot-hint .spacer { flex: 1 1 auto; }
  kbd {
    font-family: var(--mono); font-size: 10.5px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; color: var(--text-mute);
  }

  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }

  .readonly-note {
    flex: 0 0 auto; padding: 7px 16px; font-size: 12px; color: var(--text-mute);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: none;
  }
  .readonly-note.show { display: flex; align-items: center; gap: 10px; }
  .readonly-note button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===================== sidebar ===================== -->
  <aside class="sidebar">
    <div class="sb-head">
      <button class="new-btn" id="newSession"><span class="plus">＋</span>新会话</button>
    </div>
    <div class="sb-label">历史</div>
    <div class="sb-list" id="history"><div class="sb-empty">暂无历史</div></div>
    <div class="sb-foot">
      <span class="dot" id="dot"></span><span id="statusText">未连接</span>
    </div>
  </aside>

  <!-- ===================== main ===================== -->
  <div class="main-col">
    <header class="topbar">
      <div class="title" id="sessionTitle">新会话<span class="badge" id="sessionBadge">待连接</span></div>
      <div class="spacer"></div>
      <select id="agent" title="Agent"></select>
      <!-- One select per session config option the agent reports (model, reasoning, mode ...). -->
      <span class="config-selects" id="configSelects"></span>
    </header>

    <div class="readonly-note" id="readonlyNote">
      <span id="readonlyText">历史记录：这是保存下来的对话，原来的 agent 进程已经结束，所以不能在这里接着发消息。</span>
      <button id="resumeHistory">继续这个会话</button>
      <button id="backToLive">回到当前会话</button>
    </div>

    <div class="banner" id="banner"></div>

    <main id="log">
      <div class="empty" id="empty">
        <div class="logo">✦</div>
        <h2>开始一段对话</h2>
